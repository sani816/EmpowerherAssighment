            font-weight: bold;
            color: blue;

        li:nth-child(even) {
            font-style: italic;
            color: red;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="script.js"></script>
</body>
</html>
